# Issue chooser. Blank issues are off: every issue goes through a form so triage
# (docs/TRIAGE.md) has the fields it needs. Vulnerabilities never go in a public issue.
blank_issues_enabled: false
contact_links:
  - name: Security vulnerability
    url: https://github.com/3MagicLabs/borromeanRings/security/advisories/new
    about: Report privately via a GitHub security advisory (or see .github/SECURITY.md). Never as a public issue.
