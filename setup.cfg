# mutmut (heavy T1 mutation ratchet, checks/ci/60_mutation.sh) reads its config
# from setup.cfg's [mutmut] section. Kept minimal: mutate borromeanRings's own package.
# The score is ratcheted (non-regression) — see docs/ENFORCEMENT-COVERAGE.md, ADR-0022.
[mutmut]
source_paths = src/meta_harness/
# Run only the pure-logic tests: the shell-integration tests below drive bash
# checks/hooks via repo-relative paths that don't exist in mutmut's copied
# `mutants/` working dir (they'd fail the clean-test run and evaluate 0 mutants).
# They cover shell scripts, not Python, so excluding them loses no mutant coverage.
# Run only the pure-logic tests: the integration tests below reach outside
# `src/` and `tests/` via repo-relative paths that don't exist in mutmut's copied
# `mutants/` working dir (they'd fail the clean-test run and evaluate 0 mutants —
# ADR-0022 makes that fail closed rather than pass on zero). Each one asserts on
# shell scripts or repo layout, not on Python logic, and every module they touch
# reaches 100% line and branch coverage from the unit suite alone, so excluding
# them loses no mutant coverage.
pytest_add_cli_args_test_selection =
  --ignore=tests/integration/test_check_timeout.py
  --ignore=tests/integration/test_hook_stdin_timeout.py
  --ignore=tests/integration/test_hook_dedupe.py
  --ignore=tests/integration/test_gate_adversarial.py
  --ignore=tests/integration/test_hook_force_push.py
  --ignore=tests/integration/test_api_contracts_gate.py
  --ignore=tests/integration/test_api_contracts_hook.py
  --ignore=tests/integration/test_compaction_hooks.py
  --ignore=tests/integration/test_critic_judge.py
  --ignore=tests/integration/test_example_governed.py
  --ignore=tests/integration/test_harness_version_stamp.py
  --ignore=tests/integration/test_source_coherence_gate.py
  --ignore=tests/integration/test_a11y_gate.py
  --ignore=tests/integration/test_archetype_gate.py
  --ignore=tests/integration/test_swe_state_cli.py
  --ignore=tests/integration/test_rewrite_contract_hook.py
  --ignore=tests/integration/test_self_report_hook.py
  --ignore=tests/integration/test_self_description_gate.py
  --ignore=tests/integration/test_charter_gate.py
  --ignore=tests/integration/test_citations_gate.py
  --ignore=tests/integration/test_claude_plugin.py
  --ignore=tests/integration/test_context_budget_gate.py
  --ignore=tests/integration/test_quotes_gate.py
